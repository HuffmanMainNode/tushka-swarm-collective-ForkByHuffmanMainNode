[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tushka-swarm-collective"
version = "0.1.0"
description = "A model-independent, local-first framework for cooperating AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tushka Swarm Collective contributors" }]
dependencies = []

[project.scripts]
tushka-demo = "tushka.demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
